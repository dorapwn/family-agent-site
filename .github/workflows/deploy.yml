name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single gate, runnable locally too:
      #   python3 scripts/check_pages.py
      # Covers tag balance, nested <p>, dead local refs, required assets,
      # SVG well-formedness, and Markdown bold leaking into HTML.
      - name: Structural page check
        run: python3 scripts/check_pages.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "deployed to $url"
          sleep 5
          for p in "" index.html telegram.html behind.html study.html \
                   home.html work.html fun.html wishlist.html 404.html \
                   assets/four-rooms.mp4 assets/svg/mock-scores.svg; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$url/$p")
            echo "  HTTP $c  /$p"
            test "$c" = "200" || { echo "FAILED: /$p"; exit 1; }
          done