name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single gate, runnable locally too:
      #   python3 scripts/check_pages.py
      # Covers tag balance, nested <p>, dead local refs, required assets,
      # SVG well-formedness, and Markdown bold leaking into HTML.
      - name: Structural page check
        run: python3 scripts/check_pages.py

      # The TOC is generated from the headings, so it can only go stale if
      # someone adds an <h2> and skips the generator. This fails instead.
      - name: Table of contents up to date
        run: python3 scripts/add_toc.py --check

      # Browser tests for the wishlist form. Both paths are exercised: the
      # Telegram handoff used today, and the Supabase POST used once an admin
      # configures it. The Supabase suite stands up its own PostgREST stub, so
      # it needs no credentials and no secrets in CI.
      - name: Wishlist form tests
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          (cd . && python3 -m http.server 8899 &) && sleep 2
          python3 tests/test_wishform.py
          python3 tests/test_supabase_path.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "deployed to $url"
          sleep 5
          for p in "" index.html telegram.html behind.html study.html \
                   home.html work.html fun.html wishlist.html trouble.html 404.html \
                   assets/four-rooms.mp4 assets/svg/mock-scores.svg \
                   assets/svg/flow-capture.svg assets/svg/flow-publish.svg \
                   assets/svg/flow-ascii.svg assets/svg/flow-wishlist.svg \
                   assets/svg/hall-of-fame.svg \
                   supabase/submit.js supabase/wishlist.sql; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$url/$p")
            echo "  HTTP $c  /$p"
            test "$c" = "200" || { echo "FAILED: /$p"; exit 1; }
          done