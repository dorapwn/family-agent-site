<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 640 440" width="640" height="440" role="img"
     aria-labelledby="hofTitle hofDesc">
  <title id="hofTitle">星光大道 Hall of Fame</title>
  <desc id="hofDesc">一個復古街機風格嘅排行榜，自動向上捲動，標題有霓虹光，
    底部有閃爍嘅 PRESS START。純 SVG，冇相片、冇影片。</desc>

  <!--
    呢個檔案用 CSS animation 嚟郁，唔係用影片。
    想改快慢：改 .scroll 嘅 duration。想加一行：照抄一行 <g> 就得。
    鍾意唔想郁：@media (prefers-reduced-motion) 已經幫你自動停。
  -->
  <style>
    .scroll   { animation: scrollboard 5s linear infinite; }
    .marquee  { animation: marquee 12s linear infinite; }
    .blink    { animation: blink 1.1s steps(1,end) infinite; }
    .glow     { animation: glowpulse 2.6s ease-in-out infinite; }
    .twinkle  { animation: tw 3.2s ease-in-out infinite; }

    @keyframes scrollboard { from { transform: translateY(0); } to { transform: translateY(-216px); } }
    @keyframes marquee    { from { transform: translateX(0); } to { transform: translateX(-780px); } }
    @keyframes blink      { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes glowpulse  { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
    @keyframes tw         { 0%,100% { opacity: .12; } 50% { opacity: .85; } }

    @media (prefers-reduced-motion: reduce) {
      .scroll, .marquee, .blink, .glow, .twinkle { animation: none; }
    }

    .mono  { font-family: ui-monospace, 'DejaVu Sans Mono', Menlo, monospace; }
    .rank  { fill: #ff2e88; font-size: 19px; font-weight: 700; }
    .name  { fill: #e8e4dc; font-size: 19px; letter-spacing: 1px; }
    .score { fill: #ffd93d; font-size: 19px; text-anchor: end; letter-spacing: 1px; }
    .head  { fill: #22e0ff; font-size: 12px; letter-spacing: 3px; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1b0b3a"/>
      <stop offset="0.55" stop-color="#12082a"/>
      <stop offset="1"   stop-color="#0a0518"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffd93d"/>
      <stop offset="1"   stop-color="#f0a020"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- CRT 掃描線 -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.16"/>
    </pattern>

    <!-- 霓虹光 -->
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="band"><rect x="44" y="158" width="552" height="216"/></clipPath>
  </defs>

  <rect width="640" height="440" fill="url(#bg)"/>

  <!-- 頂部走馬燈 -->
  <rect x="0" y="0" width="640" height="32" fill="#0d0620" opacity="0.9"/>
  <line x1="0" y1="32" x2="640" y2="32" stroke="#ff2e88" stroke-width="1" opacity="0.6"/>
  <g clip-path="url(#marqueeClip)">
    <clipPath id="marqueeClip"><rect x="0" y="0" width="640" height="32"/></clipPath>
    <g class="marquee mono" fill="#22e0ff" font-size="15">
      <text x="0" y="21" textLength="780" lengthAdjust="spacing">&gt;&gt;&gt; WELCOME TO THE HALL OF FAME &lt;&lt;&lt;  TOP SCORE 999999  &gt;&gt;&gt; INSERT COIN &lt;&lt;&lt;  GAME OVER  </text>
      <text x="780" y="21" textLength="780" lengthAdjust="spacing">&gt;&gt;&gt; WELCOME TO THE HALL OF FAME &lt;&lt;&lt;  TOP SCORE 999999  &gt;&gt;&gt; INSERT COIN &lt;&lt;&lt;  GAME OVER  </text>
    </g>
  </g>

  <!-- 標題 -->
  <g class="mono" text-anchor="middle">
    <text x="320" y="64" font-size="13" letter-spacing="4" fill="#22e0ff">★ TOP SCORES ★</text>
    <text x="323" y="107" font-size="44" font-weight="700" letter-spacing="4"
          fill="#ff2e88" opacity="0.85">HALL OF FAME</text>
    <text x="320" y="104" font-size="44" font-weight="700" letter-spacing="4"
          fill="url(#gold)" filter="url(#neon)" class="glow">HALL OF FAME</text>
  </g>

  <!-- 排行榜外框 -->
  <rect x="36" y="128" width="568" height="248" rx="6" fill="#0c0620" opacity="0.75"
        stroke="#ff2e88" stroke-width="2"/>
  <g stroke="#22e0ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 30 140 L 30 122 L 48 122"/>
    <path d="M 610 140 L 610 122 L 592 122"/>
    <path d="M 30 364 L 30 382 L 48 382"/>
    <path d="M 610 364 L 610 382 L 592 382"/>
  </g>

  <!-- 表頭 -->
  <g class="mono head">
    <text x="62"  y="150">RANK</text>
    <text x="150" y="150">PLAYER</text>
    <text x="576" y="150" text-anchor="end">SCORE</text>
  </g>
  <line x1="44" y1="155" x2="596" y2="155" stroke="#2e2a24" stroke-width="1"/>

  <!-- 捲動區：兩份一模一樣嘅名單，接埋一齊就係無限循環 -->
  <g clip-path="url(#band)">
    <g class="scroll">
      <g id="hofRows">
        <g transform="translate(0,184)">
          <rect x="44" y="-26" width="552" height="32" fill="#ffd93d" opacity="0.10"/>
          <text class="rank mono"  x="62"  y="0" fill="#ffd93d">1</text>
          <text class="name mono"  x="150" y="0">CHAMPION</text>
          <text class="score mono" x="576" y="0">999999</text>
        </g>
        <g transform="translate(0,220)">
          <rect x="44" y="-26" width="552" height="32" fill="#ffffff" opacity="0.04"/>
          <text class="rank mono"  x="62"  y="0">2</text>
          <text class="name mono"  x="150" y="0">NEON_KNIGHT</text>
          <text class="score mono" x="576" y="0">888888</text>
        </g>
        <g transform="translate(0,256)">
          <rect x="44" y="-26" width="552" height="32" fill="#ffffff" opacity="0.04"/>
          <text class="rank mono"  x="62"  y="0">3</text>
          <text class="name mono"  x="150" y="0">PIXEL_QUEEN</text>
          <text class="score mono" x="576" y="0">777777</text>
        </g>
        <g transform="translate(0,292)">
          <rect x="44" y="-26" width="552" height="32" fill="#ffffff" opacity="0.04"/>
          <text class="rank mono"  x="62"  y="0">4</text>
          <text class="name mono"  x="150" y="0">CRT_LORD</text>
          <text class="score mono" x="576" y="0">666666</text>
        </g>
        <g transform="translate(0,328)">
          <rect x="44" y="-26" width="552" height="32" fill="#ffffff" opacity="0.04"/>
          <text class="rank mono"  x="62"  y="0">5</text>
          <text class="name mono"  x="150" y="0">MIA_K</text>
          <text class="score mono" x="576" y="0">555555</text>
        </g>
        <g transform="translate(0,364)">
          <rect x="44" y="-26" width="552" height="32" fill="#ffffff" opacity="0.04"/>
          <text class="rank mono"  x="62"  y="0">6</text>
          <text class="name mono"  x="150" y="0">SZE_2P</text>
          <text class="score mono" x="576" y="0">444444</text>
        </g>
      </g>
      <use xlink:href="#hofRows" href="#hofRows" y="216"/>
    </g>
  </g>

  <!-- 閃爍星星 -->
  <g class="twinkle" fill="#ffffff">
    <path d="M 60 62 h 10 M 65 57 v 10" stroke="#ffffff" stroke-width="2"/>
    <path d="M 580 88 h 10 M 585 83 v 10" stroke="#ffffff" stroke-width="2"/>
    <path d="M 30 200 h 8 M 34 196 v 8" stroke="#22e0ff" stroke-width="2"/>
    <path d="M 610 240 h 8 M 614 236 v 8" stroke="#22e0ff" stroke-width="2"/>
  </g>
  <g class="twinkle" fill="none" style="animation-delay:-1.1s">
    <path d="M 96 200 h 8 M 100 196 v 8" stroke="#ff2e88" stroke-width="2"/>
    <path d="M 556 64 h 8 M 560 60 v 8" stroke="#ffd93d" stroke-width="2"/>
  </g>

  <!-- 底部 -->
  <g class="mono" text-anchor="middle">
    <text x="320" y="404" font-size="19" letter-spacing="5"
          fill="#ff2e88" class="blink" filter="url(#soft)">PRESS START</text>
  </g>
  <g class="mono" font-size="11" fill="#a09a8e">
    <text x="20"  y="404">CREDIT 01</text>
    <text x="620" y="404" text-anchor="end">1UP  HIGH SCORE 999999</text>
  </g>

  <!-- CRT 效果 -->
  <rect width="640" height="440" fill="url(#scan)"/>
  <rect width="640" height="440" fill="url(#vignette)"/>
</svg>