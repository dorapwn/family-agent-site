<rect x="60" y="472" width="1160" height="66" rx="8" fill="#1a1815" stroke="#2e2a24" stroke-width="2"/><circle cx="96" cy="505" r="9" fill="#4fd0c4"/><text x="126" y="513" fill="#e8e4dc" font-size="23" font-weight="400" font-family="PingFang TC, PingFang HK, Noto Sans CJK TC, Noto Sans CJK SC, Microsoft JhengHei, WenQuanYi Zen Hei, sans-serif" text-anchor="start">邊十位做普選評議員</text><text x="1180" y="513" fill="#a09a8e" font-size="20" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">同你最直接嘅代表</text>
