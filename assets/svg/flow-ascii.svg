<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500"
     font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">
  <rect width="620" height="500" fill="#12110f"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8a33d"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#e8a33d" font-size="14">ASCII 動畫：480 格係點樣出嚟</text>

  <g stroke="#e8a33d" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <path d="M 150 62  L 150 90"/>
    <path d="M 150 124 L 150 152"/>
    <path d="M 150 186 L 150 214"/>
    <path d="M 150 248 L 150 276"/>
  </g>

  <!-- per-frame pipeline -->
  <g fill="#1a1815" stroke="#4a443c" stroke-width="1.2">
    <rect x="26" y="26"  width="248" height="36" rx="6"/>
    <rect x="26" y="90"  width="248" height="34" rx="6"/>
    <rect x="26" y="152" width="248" height="34" rx="6"/>
    <rect x="26" y="214" width="248" height="34" rx="6"/>
    <rect x="26" y="276" width="248" height="34" rx="6"/>
  </g>

  <g fill="#e8a33d">
    <circle cx="46" cy="44" r="11"/><circle cx="46" cy="107" r="11"/>
    <circle cx="46" cy="169" r="11"/><circle cx="46" cy="231" r="11"/>
    <circle cx="46" cy="293" r="11"/>
  </g>
  <g fill="#12110f" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="46" y="48">1</text><text x="46" y="111">2</text>
    <text x="46" y="173">3</text><text x="46" y="235">4</text>
    <text x="46" y="297">5</text>
  </g>

  <g fill="#e8e4dc" font-size="12">
    <text x="66" y="48">算「亮度地圖」0 到 1</text>
    <text x="66" y="111">越亮 → 越實心嘅符號</text>
    <text x="66" y="173">貼色（每場景唔同色）</text>
    <text x="66" y="235">加掃描線、光暈、雜訊</text>
    <text x="66" y="297">砌成一格，重复 480 次</text>
  </g>

  <!-- glyph ramp illustration -->
  <g>
    <rect x="310" y="26" width="292" height="96" rx="6"
          fill="#0d0f12" stroke="#2e2a24" stroke-width="1"/>
    <text x="324" y="46" fill="#4fd0c4" font-size="10.5">符號表：亮度決定用邊個</text>
    <g font-family="ui-monospace, monospace" font-size="19">
      <text x="324" y="72" fill="#e8a33d" opacity="0.18">.</text>
      <text x="384" y="72" fill="#e8a33d" opacity="0.32">·</text>
      <text x="432" y="72" fill="#e8a33d" opacity="0.48">o</text>
      <text x="472" y="72" fill="#e8a33d" opacity="0.66">*</text>
      <text x="518" y="72" fill="#e8a33d" opacity="0.84">O</text>
      <text x="558" y="72" fill="#e8a33d">@</text>
    </g>
    <path d="M 324 84 L 578 84" stroke="#4a443c" stroke-width="0.8"/>
    <g fill="#a09a8e" font-size="9.5">
      <text x="324" y="99">暗</text>
      <text x="548" y="99">亮</text>
    </g>
    <text x="324" y="113" fill="#4a443c" font-size="9">空格最暗，@ 最亮</text>
  </g>

  <!-- scene palette strip -->
  <g>
    <rect x="310" y="140" width="292" height="170" rx="6"
          fill="#0d0f12" stroke="#2e2a24" stroke-width="1"/>
    <text x="324" y="160" fill="#4fd0c4" font-size="10.5">五個場景，五種花色</text>
    <g font-size="10.5">
      <rect x="324" y="174" width="10" height="10" fill="#4fd0c4"/>
      <text x="342" y="183" fill="#a09a8e">學業 · 青綠，符號向下流</text>

      <rect x="324" y="198" width="10" height="10" fill="#e8a33d"/>
      <text x="342" y="207" fill="#a09a8e">家務 · 琥珀，一圈圈擴散</text>

      <rect x="324" y="222" width="10" height="10" fill="#5b9fd8"/>
      <text x="342" y="231" fill="#a09a8e">工作 · 鋼藍，橫掃線</text>

      <rect x="324" y="246" width="10" height="10" fill="#b06fd8"/>
      <text x="342" y="255" fill="#a09a8e">玩樂 · 紫紅，扭動曲線</text>

      <rect x="324" y="270" width="10" height="10" fill="#e8e4dc"/>
      <text x="342" y="279" fill="#a09a8e">尾 · 四種疊埋一齊</text>
    </g>
    <text x="324" y="300" fill="#4a443c" font-size="9.5">
      480 格同時計，大約 4 分鐘出片。
    </text>
  </g>

  <!-- final output -->
  <g>
    <path d="M 150 312 L 150 344" stroke="#e8a33d" stroke-width="1.6"
          fill="none" marker-end="url(#ah)"/>
    <rect x="26" y="344" width="248" height="36" rx="6"
          fill="#1a1815" stroke="#e8a33d" stroke-width="1.2"/>
    <text x="66" y="366" fill="#e8e4dc" font-size="12">出片：20 秒 MP4</text>
  </g>

  <text x="26" y="418" fill="#4a443c" font-size="10">
    冇剪輯、冇上載素材。每一格文字都係當場算出嚟。
  </text>
  <text x="26" y="444" fill="#a09a8e" font-size="10.5">
    原始碼喺 GitHub 上面，改幾行數就變成另一條片。
  </text>
  <text x="26" y="474" fill="#4a443c" font-size="10">
    由智能體自動畫成 SVG。
  </text>
</svg>