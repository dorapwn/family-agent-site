<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500"
     font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">
  <rect width="620" height="500" fill="#12110f"/>

  <defs>
    <!-- arrowhead, drawn once and reused by every connector -->
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8a33d"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#e8a33d" font-size="14">影網頁截圖：一步接一步</text>

  <!-- vertical spine; each connector spans exactly one box gap -->
  <g stroke="#e8a33d" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <path d="M 200 66  L 200 92"/>
    <path d="M 200 128 L 200 154"/>
    <path d="M 200 190 L 200 216"/>
    <path d="M 200 252 L 200 278"/>
    <path d="M 200 314 L 200 340"/>
  </g>

  <!-- boxes -->
  <g fill="#1a1815" stroke="#4a443c" stroke-width="1.2">
    <rect x="26" y="26"  width="348" height="40" rx="6"/>
    <rect x="26" y="92"  width="348" height="36" rx="6"/>
    <rect x="26" y="154" width="348" height="36" rx="6"/>
    <rect x="26" y="216" width="348" height="36" rx="6"/>
    <rect x="26" y="278" width="348" height="36" rx="6"/>
    <rect x="26" y="340" width="348" height="36" rx="6"/>
  </g>

  <!-- step number chips -->
  <g fill="#e8a33d">
    <circle cx="46"  cy="46"  r="11"/>
    <circle cx="46"  cy="110" r="11"/>
    <circle cx="46"  cy="172" r="11"/>
    <circle cx="46"  cy="234" r="11"/>
    <circle cx="46"  cy="296" r="11"/>
    <circle cx="46"  cy="358" r="11"/>
  </g>
  <g fill="#12110f" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="46" y="50">1</text>
    <text x="46" y="114">2</text>
    <text x="46" y="176">3</text>
    <text x="46" y="238">4</text>
    <text x="46" y="300">5</text>
    <text x="46" y="362">6</text>
  </g>

  <!-- labels -->
  <g fill="#e8e4dc" font-size="12.5">
    <text x="66"  y="50">你講：「幫我影 HKEAA 時間表」</text>
    <text x="66"  y="114">助理開一個無頭瀏覽器</text>
    <text x="66"  y="176">去 hkeaa.edu.hk，等頁面載入完</text>
    <text x="66"  y="238">影一張圖，存低</text>
    <text x="66"  y="300">放上 GitHub，跟網頁一齊 publish</text>
    <text x="66"  y="362">你喺指南見到嗰張圖</text>
  </g>

  <!-- side note: why direct from source -->
  <g>
    <rect x="404" y="92" width="196" height="112" rx="6"
          fill="#0d0f12" stroke="#2e2a24" stroke-width="1"/>
    <text x="418" y="114" fill="#4fd0c4" font-size="11">點解唔經二手網站？</text>
    <g fill="#a09a8e" font-size="10.5">
      <text x="418" y="136">· 原文唔會中途被改</text>
      <text x="418" y="154">· 網站日後改咗，張圖</text>
      <text x="424" y="168">   唔會變</text>
      <text x="418" y="188">· 被擋就會話你知，</text>
      <text x="424" y="202">   唔會攞殘圖充數</text>
    </g>
    <path d="M 404 148 L 380 148" stroke="#4fd0c4" stroke-width="1.2"
          stroke-dasharray="3 3" fill="none"/>
  </g>

  <text x="20" y="424" fill="#a09a8e" font-size="10.5">
    每一步都要等上一個做完先做下一步。
  </text>
  <text x="20" y="452" fill="#4a443c" font-size="10">
    由助理自動畫成 SVG —— 放大都唔會模糊，可以直接印出嚟。
  </text>
</svg>