<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">
  <rect width="640" height="360" fill="#12110f"/>

  <!-- title -->
  <text x="24" y="34" fill="#e8a33d" font-size="15">大女 · 六科模擬考分數趨勢</text>

  <!-- gridlines: y = 250 - score*2.0, so 8 gridlines at 0..7 -->
  <g stroke="#2e2a24" stroke-width="1">
    <line x1="60" y1="250" x2="616" y2="250"/>
    <line x1="60" y1="236" x2="616" y2="236"/>
    <line x1="60" y1="222" x2="616" y2="222"/>
    <line x1="60" y1="208" x2="616" y2="208"/>
    <line x1="60" y1="194" x2="616" y2="194"/>
    <line x1="60" y1="180" x2="616" y2="180"/>
    <line x1="60" y1="166" x2="616" y2="166"/>
    <line x1="60" y1="152" x2="616" y2="152"/>
  </g>

  <!-- x axis labels: 6 mock papers -->
  <g fill="#a09a8e" font-size="11" text-anchor="middle">
    <text x="60"  y="268">卷1</text>
    <text x="171" y="268">卷2</text>
    <text x="282" y="268">卷3</text>
    <text x="393" y="268">卷4</text>
    <text x="504" y="268">卷5</text>
    <text x="615" y="268">卷6</text>
  </g>

  <!-- y axis labels: grade 1**..8** -->
  <g fill="#a09a8e" font-size="11" text-anchor="end">
    <text x="52" y="254">1**</text>
    <text x="52" y="240">2**</text>
    <text x="52" y="226">3**</text>
    <text x="52" y="212">4**</text>
    <text x="52" y="198">5**</text>
    <text x="52" y="184">6**</text>
    <text x="52" y="170">7**</text>
    <text x="52" y="156">8**</text>
  </g>

  <!-- target line at 5**; label sits left of the last point so it cannot
       collide with the 6** data label, which is also right-anchored -->
  <line x1="60" y1="194" x2="616" y2="194" stroke="#4fd0c4"
        stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>
  <text x="600" y="188" fill="#4fd0c4" font-size="10" text-anchor="end">目標 5**</text>

  <!-- maths line: 3,4,4,5,5,6 -> y = 250 - (grade-1)*14 -->
  <polyline fill="none" stroke="#e8a33d" stroke-width="2.5"
    stroke-linejoin="round" stroke-linecap="round"
    points="60,238 171,224 282,224 393,210 504,210 615,196"/>

  <!-- points -->
  <g fill="#e8a33d">
    <circle cx="60"  cy="238" r="4"/>
    <circle cx="171" cy="224" r="4"/>
    <circle cx="282" cy="224" r="4"/>
    <circle cx="393" cy="210" r="4"/>
    <circle cx="504" cy="210" r="4"/>
    <circle cx="615" cy="196" r="5"/>
  </g>

  <!-- last-point label -->
  <text x="608" y="188" fill="#e8a33d" font-size="12" text-anchor="end">6**</text>

  <text x="24" y="336" fill="#a09a8e" font-size="10">由助理根據你講嘅分數直接畫出來 · SVG</text>
</svg>